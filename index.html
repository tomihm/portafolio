<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />
    <style>
      /* pantalla de carga: va en el html para verse antes de que llegue el js */
      #cargando { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0f1116; color: #8fa3c7; font: 12px "IBM Plex Mono", ui-monospace, monospace; transition: opacity .6s; }
      #cargando p { margin: 0; display: flex; align-items: center; }
      /* el texto se escribe letra por letra (36 caracteres) */
      #cargando span { display: inline-block; overflow: hidden; white-space: nowrap; width: 36ch; animation: escribir 1.6s steps(36) both; }
      #cargando i { display: inline-block; width: .6em; height: 1.15em; margin-left: 4px; background: #f2a44b; animation: parpadeo 1.06s steps(1) infinite; }
      /* la barra dura lo mismo que la espera minima de Escena.jsx (5 s) */
      #cargando b { display: block; width: 36ch; height: 2px; background: #232834; overflow: hidden; }
      #cargando b::after { content: ""; display: block; height: 100%; background: #f2a44b; animation: progreso 5s cubic-bezier(.4, 0, .2, 1) both; }
      @keyframes escribir { from { width: 0; } }
      @keyframes parpadeo { 50% { opacity: 0; } }
      @keyframes progreso { from { width: 0; } to { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { #cargando span, #cargando i { animation: none; } }
    </style>
    <title>Tomás Hernández · Portafolio</title>
  </head>
  <body>
    <div id="cargando" role="status">
      <p><span>tomas@portafolio:~$ cargando escena…</span><i aria-hidden="true"></i></p>
      <b aria-hidden="true"></b>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
